packages:
  - apps/*
  - packages/*
allowBuilds:
  '@parcel/watcher': false
  '@prisma/engines': true
  '@sentry/cli': false
  '@swc/core': false
  msgpackr-extract: false
  prisma: true
minimumReleaseAgeExclude:
  - '@types/node@24.13.5'
  - prettier@3.9.7
overrides:
  deepmerge-ts: 8.0.2
  fastify: 5.12.5
  mysql2: 3.24.4
  # GHSA-vcvr-r3jv-pc5j: apps/api never imports next, but better-auth's optional
  # next peer was resolved to 16.3.5 independently of the web/admin pins.
  'next@<16.3.6': 16.3.6
  # GHSA-pqg4-j6r4-53mv (shell-quote command injection, critical)
  'shell-quote@<1.11.0': ^1.11.0
  # GHSA-c475-qrg2-pj4r (basic-ftp quadratic-time DoS, high)
  'basic-ftp@<6.2.1': ^6.2.1
  # GHSA-68fv-2mgg-jv7q (source-map-js event-loop DoS, high)
  'source-map-js@<1.2.2': ^1.2.2
  # GHSA-wq5f-xc86-pv6w (sharp librsvg CVE, high); pinned to match apps/worker
  sharp: 0.35.5
  # GHSA-ph9p-34f9-6g65 (tmp path traversal, high) and GHSA-7c78-jf6q-g5cm
  # (tmp type-confusion path traversal, high, fixed one release later):
  # @lhci/cli depends on tmp@^0.1.0 directly and pulls a second copy via
  # inquirer>external-editor>tmp@0.0.33; 0.2.7 is the first version patched
  # against both.
  tmp: 0.2.7
  # GHSA-jmr9-qjv8-65gv and GHSA-7pqw-9j4j-h8q3 (extract-zip symlink path
  # traversal, both high, both "Patched versions: None" - extract-zip's last
  # release was 2020-06-10). puppeteer-core pulls it in via
  # @puppeteer/browsers@2.13.2's zip extraction; @puppeteer/browsers@3.0.2
  # replaced that with tar-fs and dropped extract-zip entirely, so this
  # overrides the sub-dependency rather than waiting on an extract-zip fix
  # that will never ship. puppeteer-core@24.43.1 itself still declares
  # @puppeteer/browsers@^2.10.0, but only uses the parts of its API
  # (computeExecutablePath, launch helpers) that didn't change between 2.x
  # and 3.x - verified by re-running the Lighthouse job's consent-granted
  # puppeteerScript end-to-end after this override, not assumed.
  '@puppeteer/browsers': 3.0.2
# GHSA-86w9-cpqp-85rv (node-forge) and GHSA-vfj7-8cjw-p6xm (braces) have no
# released patch. node-forge is only reachable through expo > @expo/cli code
# signing and braces through eslint-plugin-next, tailwindcss and metro; all
# run on developer or EAS build machines and never ship in api, worker or the
# web/admin runtime. Remove once patched releases exist, see #538.
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv
    - GHSA-vfj7-8cjw-p6xm

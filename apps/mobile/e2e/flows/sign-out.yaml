appId: lu.photoo.app
name: Sign out from the account tab
---
- runScript:
    file: ../scripts/create-user.js
- runScript:
    file: ../scripts/mailpit-token.js
    env:
      EMAIL: ${output.email}
      VERIFY: 'true'
- runFlow: ../subflows/fresh-start.yaml
- runFlow: ../subflows/open-sign-in.yaml
- tapOn:
    id: sign-in-email
- inputText: ${output.email}
- tapOn:
    id: sign-in-password
- inputText: ${output.password}
- hideKeyboard
- tapOn:
    id: sign-in-submit
- extendedWaitUntil:
    visible:
      id: account-email
    timeout: 20000
- scrollUntilVisible:
    element:
      id: account-sign-out
- tapOn:
    id: account-sign-out
- extendedWaitUntil:
    visible:
      id: account-sign-in
    timeout: 20000
- assertNotVisible:
    id: account-sign-out
- assertNotVisible:
    id: account-deletion

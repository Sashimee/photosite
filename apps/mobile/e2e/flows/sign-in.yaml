appId: lu.photoo.app
name: Sign in with a verified account
---
- runScript:
    file: ../scripts/create-user.js
- runScript:
    file: ../scripts/mailpit-token.js
    env:
      EMAIL: ${output.email}
      VERIFY: 'true'
- runFlow: ../subflows/fresh-start.yaml
- runFlow: ../subflows/open-sign-in.yaml
- tapOn:
    id: sign-in-email
- inputText: ${output.email}
- tapOn:
    id: sign-in-password
- inputText: ${output.password}
- hideKeyboard
- tapOn:
    id: sign-in-submit
- extendedWaitUntil:
    visible:
      id: account-deletion
    timeout: 20000
- assertNotVisible:
    id: account-sign-in

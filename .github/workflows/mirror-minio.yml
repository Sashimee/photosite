name: Mirror MinIO images

# MinIO Inc. archived github.com/minio/minio and github.com/minio/mc
# (Community Edition) and cut off anonymous access to their quay.io images
# and dl.min.io binaries (#326) - every registry and CDN they published to
# now refuses even a pinned, previously-working tag. There will be no new
# upstream release to mirror, so nobody has to remember to keep this fresh:
# it rebuilds and pushes whenever infra/docker/minio-mirror.Dockerfile itself
# changes (a deliberate MINIO_VERSION/MC_VERSION bump, which cannot happen
# upstream anymore, or a from-source security patch we apply ourselves), and
# `workflow_dispatch` stays as a manual escape hatch. ci.yml,
# infra/docker/compose.dev.yml, infra/dokploy/preview/compose.yml and
# infra/docker/backup.Dockerfile all pin the resulting
# ghcr.io/sashimee/{minio,mc} tag+digest, so a stale mirror is a loud
# image-pull failure in those, not a silent drift.
on:
  workflow_dispatch:
  push:
    paths:
      - infra/docker/minio-mirror.Dockerfile
      - .github/workflows/mirror-minio.yml

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push minio (built from source, see the Dockerfile's own comment)
        id: minio
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/minio-mirror.Dockerfile
          target: minio
          push: true
          tags: ghcr.io/sashimee/minio:RELEASE.2025-09-07T16-13-09Z
          cache-from: type=gha,scope=minio-mirror
          cache-to: type=gha,mode=max,scope=minio-mirror

      - name: Build and push mc
        id: mc
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/minio-mirror.Dockerfile
          target: mc
          push: true
          tags: ghcr.io/sashimee/mc:RELEASE.2025-08-13T08-35-41Z
          cache-from: type=gha,scope=minio-mirror
          cache-to: type=gha,mode=max,scope=minio-mirror

      - name: Print pushed digests (for pinning in consumers - not a secret)
        run: |
          echo "ghcr.io/sashimee/minio@${{ steps.minio.outputs.digest }}"
          echo "ghcr.io/sashimee/mc@${{ steps.mc.outputs.digest }}"

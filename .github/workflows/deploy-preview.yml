name: Deploy preview

# Runs after CI has gone green on `main`, not on every push to `main`
# directly - a red CI run must never reach footoo.bas.lu.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-preview
  cancel-in-progress: true

jobs:
  build-and-push:
    # workflow_run also fires for pull_request-triggered CI runs (including
    # from forks), so conclusion alone isn't enough: require a push-
    # triggered run, on this repo, on `main`.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - id: sha
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "short=sha-$(git rev-parse --short "$HEAD_SHA")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api (runtime)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/api.Dockerfile
          target: runtime
          push: true
          load: true
          tags: |
            ghcr.io/sashimee/photosite-api:main
            ghcr.io/sashimee/photosite-api:${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # Boots the image with no network and no env, which fails fast on
      # env validation - but only after Node has resolved every static
      # import, so a workspace package missing from the runtime stage
      # (ERR_MODULE_NOT_FOUND) still surfaces here before the image ever
      # reaches Dokploy.
      - name: Smoke test api image
        run: .github/workflows/smoke-test-image.sh "ghcr.io/sashimee/photosite-api:${{ steps.sha.outputs.short }}"

      # -migrate keeps devDependencies (the `prisma` CLI) the runtime target
      # strips; see infra/docker/api.Dockerfile.
      - name: Build and push api (migrate)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/api.Dockerfile
          target: migrate
          push: true
          tags: |
            ghcr.io/sashimee/photosite-api:main-migrate
            ghcr.io/sashimee/photosite-api:${{ steps.sha.outputs.short }}-migrate
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/worker.Dockerfile
          target: runtime
          push: true
          load: true
          tags: |
            ghcr.io/sashimee/photosite-worker:main
            ghcr.io/sashimee/photosite-worker:${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      # See "Smoke test api image" above for why this catches a missing
      # workspace package before Dokploy ever pulls the image.
      - name: Smoke test worker image
        run: .github/workflows/smoke-test-image.sh "ghcr.io/sashimee/photosite-worker:${{ steps.sha.outputs.short }}"

      # Repository variables, not secrets: NEXT_PUBLIC_* is inlined into the
      # client bundle either way. Defaulted so the build never hard-fails on
      # missing repo config; compose.yml's `web` service must be given the
      # same values at runtime.
      - name: Build and push web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/web.Dockerfile
          target: runtime
          push: true
          tags: |
            ghcr.io/sashimee/photosite-web:main
            ghcr.io/sashimee/photosite-web:${{ steps.sha.outputs.short }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://footoo.bas.lu' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://footoo.bas.lu' }}
            NEXT_PUBLIC_MEDIA_BASE_URL=${{ vars.NEXT_PUBLIC_MEDIA_BASE_URL || 'https://footoo.bas.lu/photoo-public' }}
            NEXT_PUBLIC_ALLOW_INDEXING=${{ vars.NEXT_PUBLIC_ALLOW_INDEXING || 'false' }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            SENTRY_REQUIRED=${{ vars.SENTRY_REQUIRED }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # Only step that requires the webhook secret, so a missing one still
      # lets the images build and push above.
      - name: Build and push backup
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/backup.Dockerfile
          push: true
          tags: |
            ghcr.io/sashimee/photosite-backup:main
            ghcr.io/sashimee/photosite-backup:${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup

      - name: Trigger Dokploy deploy webhook
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_PREVIEW_WEBHOOK_URL }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::DOKPLOY_PREVIEW_WEBHOOK_URL repository secret is not set (docs/steps/human-followups.md)" >&2
            exit 1
          fi
          # Dokploy's compose webhook parses the body like a GitHub push
          # event and rejects anything else (`{"message":"Branch Not
          # Match"}`, HTTP 301, on a bare POST). The commit message is a
          # fixed string, never the real one, so nothing from git history
          # ends up unescaped in the request.
          payload=$(jq -n --arg sha "$HEAD_SHA" '{
            ref: "refs/heads/main",
            after: $sha,
            head_commit: { message: ("deploy-preview " + $sha) }
          }')
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -H 'x-github-event: push' \
            -d "$payload")
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Dokploy deploy webhook returned HTTP $status" >&2
            exit 1
          fi

  # Nothing downstream depends on this job, so a failure here never undoes a
  # deploy that already happened - but it is no longer `continue-on-error`.
  # That flag meant this job could fail every single run without anyone
  # noticing, which is exactly what happened: it never once executed a test.
  # A check nobody can see fail is not a check. Serial and rate-limited on purpose -
  # one Playwright worker plus a delay between navigations - because the
  # opposite traffic shape got a workstation IP banned by the host's
  # CrowdSec bouncer while investigating the 2026-09-18 outage.
  post-deploy-smoke:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SMOKE_BASE_URL: https://footoo.bas.lu
      SMOKE_NAV_DELAY_MS: '2000'
      HAS_PREVIEW_SEED_PASSWORD: ${{ secrets.PREVIEW_SEED_USER_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tests/smoke/pages.ts imports @photoo/shared, which is a workspace
      # package with no built dist in a fresh checkout. Without this the
      # suite dies at import with "No tests found" - which is how it went
      # silently red from the day it was added instead of ever running.
      - name: Build the workspace packages the smoke suite imports
        run: pnpm turbo run build --filter='@photoo/shared'
      - name: Wait for the Dokploy webhook to finish rolling the deploy out
        run: timeout 180 bash -c 'until curl -sf https://footoo.bas.lu/health; do sleep 5; done'
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run the signed-out smoke suite against the live preview
        run: pnpm exec playwright test --project=smoke-public --workers=1
      - name: Run the signed-in smoke suite against the live preview
        if: env.HAS_PREVIEW_SEED_PASSWORD == 'true'
        env:
          # infra/dokploy/preview/README.md "Seed": the preview's seed run
          # uses a generated password, never the CI-only default, so this
          # needs its own repository secret (docs/steps/human-followups.md).
          SEED_USER_PASSWORD: ${{ secrets.PREVIEW_SEED_USER_PASSWORD }}
        run: pnpm exec playwright test --project=smoke-authenticated --workers=1
      # A step that only ever shows as grey "skipped" is easy to misread as
      # fine, which is the exact failure mode this job exists to fix - so the
      # gap gets its own always-run, unmissable step instead.
      - name: Report signed-in smoke coverage was skipped
        if: env.HAS_PREVIEW_SEED_PASSWORD != 'true'
        run: |
          echo "::warning::PREVIEW_SEED_USER_PASSWORD repository secret is not set (docs/steps/human-followups.md) - the signed-in pages (requests, quotes, messages, account) were NOT exercised by this deploy's smoke suite."
          {
            echo '### :warning: Signed-in smoke coverage skipped'
            echo 'PREVIEW_SEED_USER_PASSWORD is not set, so the signed-in pages (requests, quotes, messages, account) were NOT checked this run. See docs/steps/human-followups.md.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: post-deploy-smoke-report
          path: playwright-report/
          retention-days: 7

name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    # 15 minutes was enough for lint/typecheck/build alone; the postgres/redis
    # service startup plus migrating, seeding and running the previously
    # skipped db/api integration suites against them adds a few minutes.
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4010
      # Dev-only values matching infra/docker/.env.example and
      # packages/db/.env.example; never real secrets.
      DATABASE_URL: postgresql://photoo:photoo_dev_password@127.0.0.1:5432/photoo_test
      TEST_DATABASE_URL: postgresql://photoo:photoo_dev_password@127.0.0.1:5432/photoo_test
      SHADOW_DATABASE_URL: postgresql://photoo:photoo_dev_password@127.0.0.1:5432/photoo_shadow
      REDIS_URL: redis://127.0.0.1:6379
      SEED_USER_PASSWORD: correct-horse-battery-staple
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: photoo
          POSTGRES_PASSWORD: photoo_dev_password
          POSTGRES_DB: photoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U photoo -d photoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The auth integration suite reads verification/reset links from
      # Mailpit's HTTP API (apps/api/src/testing/mailpit.ts hardcodes
      # 127.0.0.1:8025), so Mailpit is a hard dependency of that suite, not an
      # optional one gated by an env var like TEST_DATABASE_URL/REDIS_URL.
      mailpit:
        image: axllent/mailpit:v1.31.1
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm i18n:check
      - run: pnpm typecheck
      - name: Create the test and shadow databases
        env:
          PGPASSWORD: photoo_dev_password
        run: |
          psql -h 127.0.0.1 -U photoo -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE photoo_test;'
          psql -h 127.0.0.1 -U photoo -d photoo_test -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS postgis;'
          psql -h 127.0.0.1 -U photoo -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE photoo_shadow;'
          psql -h 127.0.0.1 -U photoo -d photoo_shadow -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS postgis;'
      - name: Apply Prisma migrations to the test database
        run: pnpm --filter @photoo/db run migrate:deploy
      - name: Seed the test database
        run: pnpm --filter @photoo/db run seed
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @photoo/api-client generate:check
      - run: pnpm audit --audit-level high

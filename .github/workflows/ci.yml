name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    # 15 minutes was enough for lint/typecheck/build alone; the postgres/redis
    # service startup plus migrating, seeding and running the previously
    # skipped db/api integration suites against them adds a few minutes.
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4010
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      # Dev-only values matching infra/docker/.env.example and
      # packages/db/.env.example; never real secrets.
      DATABASE_URL: postgresql://photoo:photoo_dev_password@127.0.0.1:5432/photoo_test
      TEST_DATABASE_URL: postgresql://photoo:photoo_dev_password@127.0.0.1:5432/photoo_test
      SHADOW_DATABASE_URL: postgresql://photoo:photoo_dev_password@127.0.0.1:5432/photoo_shadow
      REDIS_URL: redis://127.0.0.1:6379
      SEED_USER_PASSWORD: correct-horse-battery-staple
      VERIFICATION_ENCRYPTION_KEY: 9DsORuh9HI1DUnXKM0DKVcgw36Y9NfbLBSlfPmQxwYs=
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: eu-west-1
      S3_ACCESS_KEY_ID: photoo_dev
      S3_SECRET_ACCESS_KEY: photoo_dev_password
      S3_FORCE_PATH_STYLE: 'true'
      S3_PRIVATE_BUCKET: photoo-private
      S3_PUBLIC_BUCKET: photoo-public
      S3_PUBLIC_BASE_URL: http://127.0.0.1:9000/photoo-public
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: photoo
          POSTGRES_PASSWORD: photoo_dev_password
          POSTGRES_DB: photoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U photoo -d photoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The auth integration suite reads verification/reset links from
      # Mailpit's HTTP API (apps/api/src/testing/mailpit.ts hardcodes
      # 127.0.0.1:8025), so Mailpit is a hard dependency of that suite, not an
      # optional one gated by an env var like TEST_DATABASE_URL/REDIS_URL.
      mailpit:
        image: axllent/mailpit:v1.31.1
        ports:
          - 1025:1025
          - 8025:8025
      # No `minio` entry here: GitHub Actions service containers can't be
      # given a custom command, and quay.io/minio/minio has no default CMD
      # (it needs `server /data`), so MinIO is started as a plain `docker run`
      # step below instead, using the same image tag as compose.dev.yml.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start MinIO, create buckets and allow anonymous reads of photoo-public
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=photoo_dev \
            -e MINIO_ROOT_PASSWORD=photoo_dev_password \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:9000/minio/health/ready; do sleep 1; done'
          cat > /tmp/photoo-public-anonymous-policy.json <<'EOF'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": {"AWS": ["*"]},
                "Action": ["s3:GetObject"],
                "Resource": ["arn:aws:s3:::photoo-public/*"]
              }
            ]
          }
          EOF
          docker run --rm --network host \
            --entrypoint sh \
            -e MC_HOST_local=http://photoo_dev:photoo_dev_password@127.0.0.1:9000 \
            -v /tmp/photoo-public-anonymous-policy.json:/tmp/photoo-public-anonymous-policy.json \
            quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z \
            -c "mc mb --ignore-existing local/photoo-private local/photoo-public && mc anonymous set none local/photoo-private && mc anonymous set-json /tmp/photoo-public-anonymous-policy.json local/photoo-public"
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm i18n:check
      - run: pnpm typecheck
      - name: Create the test and shadow databases
        env:
          PGPASSWORD: photoo_dev_password
        run: |
          psql -h 127.0.0.1 -U photoo -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE photoo_test;'
          psql -h 127.0.0.1 -U photoo -d photoo_test -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS postgis;'
          psql -h 127.0.0.1 -U photoo -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE photoo_shadow;'
          psql -h 127.0.0.1 -U photoo -d photoo_shadow -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS postgis;'
      - name: Apply Prisma migrations to the test database
        run: pnpm --filter @photoo/db run migrate:deploy
      - name: Seed the test database
        run: pnpm --filter @photoo/db run seed
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @photoo/api-client generate:check
      - run: pnpm audit --audit-level high

  # Playwright against real, running apps/web + apps/api (docs/steps/1E.9-browser-smoke.md):
  # curl and `next build` both saw a 200 for the env.ts bug that blanked the
  # client bundle - only a real browser catches that class of bug, so this
  # job builds and boots the actual servers and clicks around them.
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 127.0.0.1 everywhere, never localhost: Better Auth's CORS allow-list
      # (WEB_ORIGINS) is an exact origin match, and localhost/127.0.0.1 count
      # as different origins - mixing them silently breaks the browser
      # sign-in call with no error surfaced beyond a network-level CORS
      # rejection.
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_MEDIA_BASE_URL: http://127.0.0.1:9000/photoo-public
      NEXT_PUBLIC_ALLOW_INDEXING: 'false'
      DATABASE_URL: postgresql://photoo:photoo_dev_password@127.0.0.1:5432/photoo_test
      # `prisma migrate deploy` never touches a shadow database, but this
      # repo's prisma.config.ts validates the variable at load time, so the
      # job fails without it (see the `checks` job, which sets the same).
      SHADOW_DATABASE_URL: postgresql://photoo:photoo_dev_password@127.0.0.1:5432/photoo_shadow
      REDIS_URL: redis://127.0.0.1:6379
      SEED_USER_PASSWORD: correct-horse-battery-staple
      VERIFICATION_ENCRYPTION_KEY: 9DsORuh9HI1DUnXKM0DKVcgw36Y9NfbLBSlfPmQxwYs=
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: eu-west-1
      S3_ACCESS_KEY_ID: photoo_dev
      S3_SECRET_ACCESS_KEY: photoo_dev_password
      S3_FORCE_PATH_STYLE: 'true'
      S3_PRIVATE_BUCKET: photoo-private
      S3_PUBLIC_BUCKET: photoo-public
      S3_PUBLIC_BASE_URL: http://127.0.0.1:9000/photoo-public
      PORT: 4000
      PUBLIC_API_URL: http://127.0.0.1:4000
      WEB_ORIGINS: http://127.0.0.1:3000
      WEB_APP_URL: http://127.0.0.1:3000
      # Local-MinIO workaround only, not a general "run in dev mode" pattern:
      # `next build` always forces NODE_ENV=production regardless of this
      # (verified - the CSP nonce logic below, baked into the edge-bundled
      # proxy at build time, is unaffected), but `next start`'s image
      # optimizer reads a live NODE_ENV, and without this it rejects every
      # avatar/portfolio thumbnail from 127.0.0.1:9000 as a private-IP SSRF
      # target ("url parameter is not allowed"), which real production never
      # hits because its media host is a public domain. Whoever next touches
      # this job: do not "clean this up" by removing it, and do not copy it
      # anywhere that isn't pointed at a local MinIO.
      NODE_ENV: development
      TRUSTED_PROXIES: ''
      AUTH_SECRET: dev-only-auth-secret-change-me-please-32-chars-min
      AUTH_ENCRYPTION_KEY: qA5jxlkWykGDbMKLOSqgSGG+lbzsuDkUWUS8nV9twig=
      SMOKE_BASE_URL: http://127.0.0.1:3000
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: photoo
          POSTGRES_PASSWORD: photoo_dev_password
          POSTGRES_DB: photoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U photoo -d photoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start MinIO, create buckets and allow anonymous reads of photoo-public
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=photoo_dev \
            -e MINIO_ROOT_PASSWORD=photoo_dev_password \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:9000/minio/health/ready; do sleep 1; done'
          cat > /tmp/photoo-public-anonymous-policy.json <<'EOF'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": {"AWS": ["*"]},
                "Action": ["s3:GetObject"],
                "Resource": ["arn:aws:s3:::photoo-public/*"]
              }
            ]
          }
          EOF
          docker run --rm --network host \
            --entrypoint sh \
            -e MC_HOST_local=http://photoo_dev:photoo_dev_password@127.0.0.1:9000 \
            -v /tmp/photoo-public-anonymous-policy.json:/tmp/photoo-public-anonymous-policy.json \
            quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z \
            -c "mc mb --ignore-existing local/photoo-private local/photoo-public && mc anonymous set none local/photoo-private && mc anonymous set-json /tmp/photoo-public-anonymous-policy.json local/photoo-public"
      - name: Create the test database
        env:
          PGPASSWORD: photoo_dev_password
        run: |
          psql -h 127.0.0.1 -U photoo -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE photoo_test;'
          psql -h 127.0.0.1 -U photoo -d photoo_test -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS postgis;'
      # The seed is TypeScript that imports @photoo/shared, so those packages
      # must be built before it compiles. The `checks` job gets this for free
      # because `pnpm typecheck` runs first and turbo builds dependencies on
      # the way; this job has no typecheck step, so it asks explicitly.
      - name: Build the workspace packages the seed imports
        run: pnpm turbo run build --filter='@photoo/db^...'
      - name: Apply Prisma migrations and seed the test database
        run: pnpm --filter @photoo/db run migrate:deploy && pnpm --filter @photoo/db run seed
      - name: Build api and web
        run: pnpm exec turbo run build --filter=@photoo/api... --filter=@photoo/web...
      - name: Start api and web, wait until both answer
        run: |
          pnpm --filter @photoo/api start &
          pnpm --filter @photoo/web start &
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:4000/health; do sleep 1; done'
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:3000/en; do sleep 1; done'
      - name: Install the smoke project's browser
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:smoke
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Real test of infra/dokploy/backup/backup.sh: builds the same image the
  # preview's `backup` service runs, so this also catches a broken
  # infra/docker/backup.Dockerfile (docs/steps/1E.3-backups.md), then
  # asserts the object it uploads decrypts and restores, and that the
  # missing-BACKUP_AGE_RECIPIENT guard actually refuses to run.
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: photoo
          POSTGRES_PASSWORD: photoo_dev_password
          POSTGRES_DB: photoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U photoo -d photoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build the backup image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/backup.Dockerfile
          tags: photosite-backup:ci
          load: true
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup

      - name: Start MinIO and create the backup bucket with a scoped user
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=rootuser -e MINIO_ROOT_PASSWORD=rootpassword123 \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:9000/minio/health/ready; do sleep 1; done'
          cat > /tmp/photoo-backup-policy.json <<'EOF'
          {
            "Version": "2012-10-17",
            "Statement": [
              {"Effect": "Allow", "Action": ["s3:ListBucket"], "Resource": ["arn:aws:s3:::photoo-backups"]},
              {"Effect": "Allow", "Action": ["s3:PutObject"], "Resource": ["arn:aws:s3:::photoo-backups/*"]}
            ]
          }
          EOF
          docker run --rm --network host \
            --entrypoint sh \
            -e MC_HOST_local=http://rootuser:rootpassword123@127.0.0.1:9000 \
            -v /tmp/photoo-backup-policy.json:/tmp/photoo-backup-policy.json \
            quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z \
            -c "mc mb --ignore-existing local/photoo-backups && mc anonymous set none local/photoo-backups && mc admin user add local backupuser backuppassword123 && mc admin policy create local photoo-backup /tmp/photoo-backup-policy.json && mc admin policy attach local photoo-backup --user backupuser"

      - name: Seed rows past the size floor
        env:
          PGPASSWORD: photoo_dev_password
        run: |
          psql -h 127.0.0.1 -U photoo -d photoo -v ON_ERROR_STOP=1 -c "
            CREATE TABLE demo (id serial primary key, name text);
            INSERT INTO demo (name) SELECT 'row-with-padding-' || g FROM generate_series(1, 3000) g;
          "

      - name: Generate a throwaway age identity
        run: |
          docker run --rm --entrypoint age-keygen photosite-backup:ci >/tmp/identity.txt 2>/tmp/pubkey.txt
          echo "recipient=$(sed -n 's/^Public key: //p' /tmp/pubkey.txt)" >>"$GITHUB_ENV"

      - name: Run backup.sh
        run: |
          docker run --rm --network host --entrypoint backup.sh \
            -e POSTGRES_HOST=127.0.0.1 -e POSTGRES_USER=photoo -e POSTGRES_PASSWORD=photoo_dev_password -e POSTGRES_DB=photoo \
            -e BACKUP_AGE_RECIPIENT="${{ env.recipient }}" \
            -e BACKUP_ENV=ci -e MINIO_ENDPOINT=http://127.0.0.1:9000 -e BACKUP_BUCKET=photoo-backups \
            -e BACKUP_ACCESS_KEY=backupuser -e BACKUP_SECRET_KEY=backuppassword123 \
            photosite-backup:ci

      - name: Assert an encrypted, restorable object appears
        run: |
          object=$(docker run --rm --network host \
            -e MC_HOST_local=http://rootuser:rootpassword123@127.0.0.1:9000 \
            quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z \
            find local/photoo-backups/photoo/ci/ --name '*.dump.age')
          test -n "$object"
          mkdir -p /tmp/verify && chmod 777 /tmp/verify
          docker run --rm --network host \
            -e MC_HOST_local=http://rootuser:rootpassword123@127.0.0.1:9000 \
            -v /tmp/verify:/verify \
            quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z cp "$object" /verify/dump.age
          docker run --rm -v /tmp/verify:/verify -v /tmp/identity.txt:/identity.txt \
            --entrypoint sh photosite-backup:ci -c \
            'age --decrypt -i /identity.txt -o /verify/dump.plain /verify/dump.age && pg_restore --list /verify/dump.plain | grep -q "TABLE DATA"'

      - name: Confirm the missing-BACKUP_AGE_RECIPIENT guard refuses to run
        run: |
          if docker run --rm --network host --entrypoint backup.sh \
              -e POSTGRES_HOST=127.0.0.1 -e POSTGRES_USER=photoo -e POSTGRES_PASSWORD=photoo_dev_password -e POSTGRES_DB=photoo \
              -e BACKUP_ENV=ci -e MINIO_ENDPOINT=http://127.0.0.1:9000 -e BACKUP_BUCKET=photoo-backups \
              -e BACKUP_ACCESS_KEY=backupuser -e BACKUP_SECRET_KEY=backuppassword123 \
              photosite-backup:ci; then
            echo "::error::backup.sh must refuse to run without BACKUP_AGE_RECIPIENT" >&2
            exit 1
          fi

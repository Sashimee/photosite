name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    # 15 minutes was enough for lint/typecheck/build alone; the postgres/redis
    # service startup plus migrating, seeding and running the previously
    # skipped db/api integration suites against them adds a few minutes.
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4010
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      # Dev-only values matching infra/docker/.env.example and
      # packages/db/.env.example; never real secrets.
      DATABASE_URL: postgresql://photoo:photoo_dev_password@127.0.0.1:5432/photoo_test
      TEST_DATABASE_URL: postgresql://photoo:photoo_dev_password@127.0.0.1:5432/photoo_test
      SHADOW_DATABASE_URL: postgresql://photoo:photoo_dev_password@127.0.0.1:5432/photoo_shadow
      REDIS_URL: redis://127.0.0.1:6379
      SEED_USER_PASSWORD: correct-horse-battery-staple
      VERIFICATION_ENCRYPTION_KEY: 9DsORuh9HI1DUnXKM0DKVcgw36Y9NfbLBSlfPmQxwYs=
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: eu-west-1
      S3_ACCESS_KEY_ID: photoo_dev
      S3_SECRET_ACCESS_KEY: photoo_dev_password
      S3_FORCE_PATH_STYLE: 'true'
      S3_PRIVATE_BUCKET: photoo-private
      S3_PUBLIC_BUCKET: photoo-public
      S3_PUBLIC_BASE_URL: http://127.0.0.1:9000/photoo-public
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: photoo
          POSTGRES_PASSWORD: photoo_dev_password
          POSTGRES_DB: photoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U photoo -d photoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The auth integration suite reads verification/reset links from
      # Mailpit's HTTP API (apps/api/src/testing/mailpit.ts hardcodes
      # 127.0.0.1:8025), so Mailpit is a hard dependency of that suite, not an
      # optional one gated by an env var like TEST_DATABASE_URL/REDIS_URL.
      mailpit:
        image: axllent/mailpit:v1.31.1
        ports:
          - 1025:1025
          - 8025:8025
      # No `minio` entry here: GitHub Actions service containers can't be
      # given a custom command, and quay.io/minio/minio has no default CMD
      # (it needs `server /data`), so MinIO is started as a plain `docker run`
      # step below instead, using the same image tag as compose.dev.yml.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # apps/mobile/app/(auth)/*.test.tsx calls renderRouter('./app', ...),
      # which pulls in the whole react-native/expo module graph from cold.
      # Caching jest's on-disk transform cache means only the first CI run
      # (or the first one after a dependency/config bump) pays that cost.
      # `jest --showConfig` is the source of truth for the path: it's derived
      # from the runner's uid (jest-config's getCacheDirectory), not safe to
      # hardcode (#201).
      - name: Resolve the mobile app's jest transform cache directory
        id: jest-cache-dir
        run: echo "path=$(pnpm --filter @photoo/mobile exec jest --showConfig | jq -r '.configs[0].cacheDirectory')" >> "$GITHUB_OUTPUT"
      - name: Cache the mobile app's jest transform cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.jest-cache-dir.outputs.path }}
          # Keyed on the lockfile and on babel/jest config so a dependency
          # bump or a config change invalidates the cache instead of reusing
          # a transform compiled under the old rules.
          key: mobile-jest-transform-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/babel.config.js', 'apps/mobile/jest.config.js') }}
      - name: Start MinIO, create buckets and allow anonymous reads of photoo-public
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=photoo_dev \
            -e MINIO_ROOT_PASSWORD=photoo_dev_password \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:9000/minio/health/ready; do sleep 1; done'
          cat > /tmp/photoo-public-anonymous-policy.json <<'EOF'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": {"AWS": ["*"]},
                "Action": ["s3:GetObject"],
                "Resource": ["arn:aws:s3:::photoo-public/*"]
              }
            ]
          }
          EOF
          docker run --rm --network host \
            --entrypoint sh \
            -e MC_HOST_local=http://photoo_dev:photoo_dev_password@127.0.0.1:9000 \
            -v /tmp/photoo-public-anonymous-policy.json:/tmp/photoo-public-anonymous-policy.json \
            quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z \
            -c "mc mb --ignore-existing local/photoo-private local/photoo-public && mc anonymous set none local/photoo-private && mc anonymous set-json /tmp/photoo-public-anonymous-policy.json local/photoo-public"
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm i18n:check
      - run: pnpm typecheck
      - name: Create the test and shadow databases
        env:
          PGPASSWORD: photoo_dev_password
        run: |
          psql -h 127.0.0.1 -U photoo -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE photoo_test;'
          psql -h 127.0.0.1 -U photoo -d photoo_test -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS postgis;'
          psql -h 127.0.0.1 -U photoo -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE photoo_shadow;'
          psql -h 127.0.0.1 -U photoo -d photoo_shadow -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS postgis;'
      - name: Apply Prisma migrations to the test database
        run: pnpm --filter @photoo/db run migrate:deploy
      - name: Seed the test database
        run: pnpm --filter @photoo/db run seed
      # `pnpm test` (turbo run test) fans out across all ~9 workspaces at
      # turbo's default concurrency of 10, i.e. effectively unbounded. On this
      # runner's core count that oversubscribes the CPU: apps/mobile's jest
      # (renderRouter's cold react-native/expo transform, #201) gets starved
      # by the vitest suites running at the same time, and a test that takes
      # ~2s uncontended has measured at 21s+ under that contention locally.
      # Bounding concurrency to the actual core count removes the starvation
      # without changing total throughput (verified locally: same wall time,
      # no more oversubscribed tail latency).
      #
      # That bound alone was not enough (#201 recurred after it shipped):
      # turbo's --concurrency only bounds how many *tasks* run at once, not
      # how many processes each task then spawns. Every vitest workspace and
      # apps/mobile's jest each size their own worker pool from the runner's
      # total core count by default, so up to $(nproc) tasks can still each
      # fork up to $(nproc) workers - the same oversubscription, one level
      # down. `--maxWorkers=2` after `--` is forwarded by turbo to every
      # task's own "test" script (confirmed locally: an unrecognised flag
      # there fails the task, so this is a real pass-through, not a no-op),
      # capping every workspace's pool to the same small, fixed number
      # regardless of how many tasks and cores the runner has. A workflow-level
      # flag over per-package config so the bound is uniform across jest and
      # every vitest workspace in one place, and so `pnpm --filter @photoo/mobile
      # test` (and every other workspace's local `test` run) is completely
      # unaffected - this only ever runs in CI.
      - name: Run tests (turbo concurrency and each task's own worker pool both bounded, see comment above)
        run: pnpm exec turbo run test --concurrency="$(nproc)" -- --maxWorkers=2
      - run: pnpm build
      - run: pnpm --filter @photoo/api-client generate:check
      - run: pnpm audit --audit-level high

  # Playwright against real, running apps/web + apps/api (docs/steps/1E.9-browser-smoke.md):
  # curl and `next build` both saw a 200 for the env.ts bug that blanked the
  # client bundle - only a real browser catches that class of bug, so this
  # job builds and boots the actual servers and clicks around them.
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 127.0.0.1 everywhere, never localhost: Better Auth's CORS allow-list
      # (WEB_ORIGINS) is an exact origin match, and localhost/127.0.0.1 count
      # as different origins - mixing them silently breaks the browser
      # sign-in call with no error surfaced beyond a network-level CORS
      # rejection.
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_MEDIA_BASE_URL: http://127.0.0.1:9000/photoo-public
      # Matches S3_ENDPOINT below (#322): the presigned PUT/GET URL host, which
      # differs from the public read path above once a real deployment fronts
      # MinIO with a reverse proxy.
      NEXT_PUBLIC_STORAGE_ORIGIN: http://127.0.0.1:9000
      NEXT_PUBLIC_ALLOW_INDEXING: 'false'
      # Local-MinIO workaround only, not a general "run in dev mode" pattern:
      # without it, apps/web/next.config.ts bakes `dangerouslyAllowLocalIP:
      # false` into the build, and the image optimizer rejects every
      # avatar/portfolio thumbnail from 127.0.0.1:9000 as a private-IP SSRF
      # target ("url parameter is not allowed"), which real production never
      # hits because its media host is a public domain. Whoever next touches
      # this job: do not "clean this up" by removing it, and do not copy it
      # anywhere that isn't pointed at a local MinIO.
      ALLOW_LOCAL_IMAGE_HOSTS: 'true'
      DATABASE_URL: postgresql://photoo:photoo_dev_password@127.0.0.1:5432/photoo_test
      # `prisma migrate deploy` never touches a shadow database, but this
      # repo's prisma.config.ts validates the variable at load time, so the
      # job fails without it (see the `checks` job, which sets the same).
      SHADOW_DATABASE_URL: postgresql://photoo:photoo_dev_password@127.0.0.1:5432/photoo_shadow
      REDIS_URL: redis://127.0.0.1:6379
      SEED_USER_PASSWORD: correct-horse-battery-staple
      VERIFICATION_ENCRYPTION_KEY: 9DsORuh9HI1DUnXKM0DKVcgw36Y9NfbLBSlfPmQxwYs=
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: eu-west-1
      S3_ACCESS_KEY_ID: photoo_dev
      S3_SECRET_ACCESS_KEY: photoo_dev_password
      S3_FORCE_PATH_STYLE: 'true'
      S3_PRIVATE_BUCKET: photoo-private
      S3_PUBLIC_BUCKET: photoo-public
      S3_PUBLIC_BASE_URL: http://127.0.0.1:9000/photoo-public
      PORT: 4000
      PUBLIC_API_URL: http://127.0.0.1:4000
      WEB_ORIGINS: http://127.0.0.1:3000
      WEB_APP_URL: http://127.0.0.1:3000
      # apps/api's env validation (apps/api/src/config/env.ts) refuses these
      # dev-only placeholder secrets once NODE_ENV=production.
      NODE_ENV: development
      TRUSTED_PROXIES: ''
      AUTH_SECRET: dev-only-auth-secret-change-me-please-32-chars-min
      AUTH_ENCRYPTION_KEY: qA5jxlkWykGDbMKLOSqgSGG+lbzsuDkUWUS8nV9twig=
      SMOKE_BASE_URL: http://127.0.0.1:3000
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: photoo
          POSTGRES_PASSWORD: photoo_dev_password
          POSTGRES_DB: photoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U photoo -d photoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start MinIO, create buckets and allow anonymous reads of photoo-public
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=photoo_dev \
            -e MINIO_ROOT_PASSWORD=photoo_dev_password \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:9000/minio/health/ready; do sleep 1; done'
          cat > /tmp/photoo-public-anonymous-policy.json <<'EOF'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": {"AWS": ["*"]},
                "Action": ["s3:GetObject"],
                "Resource": ["arn:aws:s3:::photoo-public/*"]
              }
            ]
          }
          EOF
          docker run --rm --network host \
            --entrypoint sh \
            -e MC_HOST_local=http://photoo_dev:photoo_dev_password@127.0.0.1:9000 \
            -v /tmp/photoo-public-anonymous-policy.json:/tmp/photoo-public-anonymous-policy.json \
            quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z \
            -c "mc mb --ignore-existing local/photoo-private local/photoo-public && mc anonymous set none local/photoo-private && mc anonymous set-json /tmp/photoo-public-anonymous-policy.json local/photoo-public"
      - name: Create the test database
        env:
          PGPASSWORD: photoo_dev_password
        run: |
          psql -h 127.0.0.1 -U photoo -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE photoo_test;'
          psql -h 127.0.0.1 -U photoo -d photoo_test -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS postgis;'
      # The seed is TypeScript that imports @photoo/shared, so those packages
      # must be built before it compiles. The `checks` job gets this for free
      # because `pnpm typecheck` runs first and turbo builds dependencies on
      # the way; this job has no typecheck step, so it asks explicitly.
      - name: Build the workspace packages the seed imports
        run: pnpm turbo run build --filter='@photoo/db^...'
      - name: Apply Prisma migrations and seed the test database
        run: pnpm --filter @photoo/db run migrate:deploy && pnpm --filter @photoo/db run seed
      - name: Build api and web
        run: pnpm exec turbo run build --filter=@photoo/api... --filter=@photoo/web...
      - name: Start api and web, wait until both answer
        run: |
          # infra/docker/web.Dockerfile runs the standalone server `next
          # build` produces (`next start` doesn't support `output:
          # standalone` and next itself warns about it at boot), so this
          # does the same rather than the dev-only `next start`.
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/
          pnpm --filter @photoo/api start &
          PORT=3000 HOSTNAME=0.0.0.0 node apps/web/.next/standalone/apps/web/server.js &

          # A bare `curl -s` swallows curl's own error (a reset, a stalled
          # connection, a short read) along with its progress meter, leaving
          # only this loop's own generic timeout to diagnose a failure from.
          # -S restores it, and the body/status get printed on the final
          # attempt so a stuck or truncated response explains itself.
          wait_for() {
            local url="$1" deadline=$((SECONDS + 60)) body status
            body="$(mktemp)"
            while true; do
              # --max-time bounds each attempt: without it, one connection
              # that's accepted but never answered hangs this curl call
              # forever, and the deadline below never gets checked.
              status="$(curl -sS --max-time 5 -o "$body" -w '%{http_code}' "$url" 2>"$body.err")" \
                && [ "$status" = 200 ] && { rm -f "$body" "$body.err"; return 0; }
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::$url did not answer with HTTP 200 within 60s (last status: ${status:-none, see curl error below})"
                echo '--- curl stderr ---'; cat "$body.err"
                echo '--- response body ---'; cat "$body"
                rm -f "$body" "$body.err"
                return 1
              fi
              sleep 1
            done
          }

          wait_for http://127.0.0.1:4000/health
          wait_for http://127.0.0.1:3000/en
      - name: Install the smoke project's browser
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:smoke
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # docs/steps/1B.12-web-e2e.md: real flows through apps/web (sign-up +
  # verify, request -> quote -> accept, chat, onboarding, job board), not
  # `browser-smoke`'s "did the page load". Its own job for the same reason
  # `browser-smoke` is already separate from `checks`: a much larger, network-
  # and email-round-trip-heavy suite folded into `browser-smoke` would blow
  # that job's fast, near-unconditional budget and muddy what a red
  # `browser-smoke` means. Clones `browser-smoke`'s boot steps rather than
  # inventing a second way to bring the stack up, and adds a `mailpit`
  # service (`checks`' own copy) plus a running `apps/worker`, because
  # `createVerifiedUser` (apps/web/e2e/fixtures/users.ts) needs a real,
  # delivered verification email - apps/api only enqueues that email
  # (apps/api/src/testing/test-email-worker.module.ts's own comment: "the
  # worker owns delivery"), which `browser-smoke`'s pre-verified seeded
  # accounts never needed.
  #
  # Non-blocking while it burns in (docs/steps/1B.12-web-e2e.md "Decisions
  # for this step"): a flaky e2e suite that blocks merges teaches people to
  # re-run rather than read, worse than no suite at all - #201/#277/#288/#304
  # already paid for that lesson elsewhere, and real navigation, real
  # sockets and real email round trips together are a strictly higher-flake
  # category than any of those. This job still reports its real result -
  # no `continue-on-error` hiding a failure the way deploy-preview.yml's
  # `post-deploy-smoke` once did ("a check nobody can see fail is not a
  # check") - it simply isn't listed as a required status check in branch
  # protection yet. Promoting it once it has burned in (repeated clean
  # passes on real PRs, no failure traceable to the harness itself) is
  # tracked in docs/steps/human-followups.md as a branch-protection setting,
  # not something this file can flip on its own.
  e2e:
    runs-on: ubuntu-latest
    # Target: the Playwright run itself under 10 minutes, this whole job
    # under 20, matching `browser-smoke`'s own budget so the two stay
    # comparable (docs/steps/1B.12-web-e2e.md). If a spec routinely pushes
    # past that, the fix is to cut or split it, never to raise this number.
    timeout-minutes: 20
    env:
      # See browser-smoke's copy of this comment before touching any of the
      # 127.0.0.1-vs-localhost, ALLOW_LOCAL_IMAGE_HOSTS or dev-only-secret
      # values below - same host, same reasons.
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_MEDIA_BASE_URL: http://127.0.0.1:9000/photoo-public
      # Matches S3_ENDPOINT below (#322): the presigned PUT/GET URL host, which
      # differs from the public read path above once a real deployment fronts
      # MinIO with a reverse proxy.
      NEXT_PUBLIC_STORAGE_ORIGIN: http://127.0.0.1:9000
      NEXT_PUBLIC_ALLOW_INDEXING: 'false'
      ALLOW_LOCAL_IMAGE_HOSTS: 'true'
      DATABASE_URL: postgresql://photoo:photoo_dev_password@127.0.0.1:5432/photoo_test
      SHADOW_DATABASE_URL: postgresql://photoo:photoo_dev_password@127.0.0.1:5432/photoo_shadow
      REDIS_URL: redis://127.0.0.1:6379
      SEED_USER_PASSWORD: correct-horse-battery-staple
      VERIFICATION_ENCRYPTION_KEY: 9DsORuh9HI1DUnXKM0DKVcgw36Y9NfbLBSlfPmQxwYs=
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: eu-west-1
      S3_ACCESS_KEY_ID: photoo_dev
      S3_SECRET_ACCESS_KEY: photoo_dev_password
      S3_FORCE_PATH_STYLE: 'true'
      S3_PRIVATE_BUCKET: photoo-private
      S3_PUBLIC_BUCKET: photoo-public
      S3_PUBLIC_BASE_URL: http://127.0.0.1:9000/photoo-public
      PORT: 4000
      PUBLIC_API_URL: http://127.0.0.1:4000
      WEB_ORIGINS: http://127.0.0.1:3000
      WEB_APP_URL: http://127.0.0.1:3000
      NODE_ENV: development
      TRUSTED_PROXIES: ''
      AUTH_SECRET: dev-only-auth-secret-change-me-please-32-chars-min
      AUTH_ENCRYPTION_KEY: qA5jxlkWykGDbMKLOSqgSGG+lbzsuDkUWUS8nV9twig=
      # apps/worker's own SMTP target for the mailpit service below - see the
      # job comment for why apps/worker has to run here at all.
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '1025'
      SMTP_SECURE: 'false'
      SMTP_FROM: dev@photoo.test
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: photoo
          POSTGRES_PASSWORD: photoo_dev_password
          POSTGRES_DB: photoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U photoo -d photoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Same image/ports as the `checks` job - see its own comment on why
      # Mailpit is a hard dependency, not an optional one.
      mailpit:
        image: axllent/mailpit:v1.31.1
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start MinIO, create buckets and allow anonymous reads of photoo-public
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=photoo_dev \
            -e MINIO_ROOT_PASSWORD=photoo_dev_password \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:9000/minio/health/ready; do sleep 1; done'
          cat > /tmp/photoo-public-anonymous-policy.json <<'EOF'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": {"AWS": ["*"]},
                "Action": ["s3:GetObject"],
                "Resource": ["arn:aws:s3:::photoo-public/*"]
              }
            ]
          }
          EOF
          docker run --rm --network host \
            --entrypoint sh \
            -e MC_HOST_local=http://photoo_dev:photoo_dev_password@127.0.0.1:9000 \
            -v /tmp/photoo-public-anonymous-policy.json:/tmp/photoo-public-anonymous-policy.json \
            quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z \
            -c "mc mb --ignore-existing local/photoo-private local/photoo-public && mc anonymous set none local/photoo-private && mc anonymous set-json /tmp/photoo-public-anonymous-policy.json local/photoo-public"
      - name: Create the test database
        env:
          PGPASSWORD: photoo_dev_password
        run: |
          psql -h 127.0.0.1 -U photoo -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE photoo_test;'
          psql -h 127.0.0.1 -U photoo -d photoo_test -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS postgis;'
      # Same reason as browser-smoke: the seed imports @photoo/shared, and
      # this job has no typecheck step to build it as a side effect.
      - name: Build the workspace packages the seed imports
        run: pnpm turbo run build --filter='@photoo/db^...'
      - name: Apply Prisma migrations and seed the test database
        run: pnpm --filter @photoo/db run migrate:deploy && pnpm --filter @photoo/db run seed
      - name: Build api, web and worker
        run: pnpm exec turbo run build --filter=@photoo/api... --filter=@photoo/web... --filter=@photoo/worker...
      - name: Start api, web and worker, wait until all three answer
        run: |
          # Same standalone-server reasoning as browser-smoke - see its copy
          # of this comment.
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/
          pnpm --filter @photoo/api start &
          PORT=3000 HOSTNAME=0.0.0.0 node apps/web/.next/standalone/apps/web/server.js &
          pnpm --filter @photoo/worker start &

          # Same `curl -sS --max-time 5` reasoning as browser-smoke - a wait
          # that times out silently is a debugging tax on whoever hits it next.
          wait_for() {
            local url="$1" deadline=$((SECONDS + 60)) body status
            body="$(mktemp)"
            while true; do
              status="$(curl -sS --max-time 5 -o "$body" -w '%{http_code}' "$url" 2>"$body.err")" \
                && [ "$status" = 200 ] && { rm -f "$body" "$body.err"; return 0; }
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::$url did not answer with HTTP 200 within 60s (last status: ${status:-none, see curl error below})"
                echo '--- curl stderr ---'; cat "$body.err"
                echo '--- response body ---'; cat "$body"
                rm -f "$body" "$body.err"
                return 1
              fi
              sleep 1
            done
          }

          wait_for http://127.0.0.1:4000/health
          wait_for http://127.0.0.1:3000/en
          # /ready (not /health) so this also blocks until the worker's own
          # DB and Redis connections are up - createVerifiedUser needs it
          # actively consuming the email queue, not just alive.
          wait_for http://127.0.0.1:4100/ready
      - name: Install the e2e project's browser
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-e2e
          path: playwright-report/
          retention-days: 7

  # Core Web Vitals budget (docs/steps/1B.11-seo.md). Its own job, not a step
  # in `checks` or `browser-smoke`: Lighthouse's timings are sensitive to CPU
  # contention (#201 - the very reason `checks` bounds test worker pools),
  # and a shared job would put it in the same boat as every vitest/jest
  # process fighting for the runner's cores. Alone in its own job, the only
  # contention left is whatever GitHub's own runner does in the background,
  # and tests/lighthouse/budgets.cjs's headroom is sized for that (see the
  # comment there for the measured baseline). `numberOfRuns: 5` and asserting
  # against the median-proximity "representative" run (read-results.cjs,
  # reusing @lhci/utils's own selection so this matches what `lhci assert`
  # itself would pick) further damp single-run noise on top of that.
  #
  # Gates on LCP, CLS and total byte weight with consent denied - the
  # default first-visit state (lighthouserc.cjs) - because those are the
  # metrics the build controls. Consent granted (lighthouserc.consent-granted.cjs)
  # only reports: it exists so a future GTM container (2.6) shows up as a
  # number to watch instead of turning this gate flaky the day it ships.
  lighthouse:
    runs-on: ubuntu-latest
    # ~2m40s locally for one 5-run/3-URL collect (15 Lighthouse runs); this
    # job does that twice (denied + consent-granted) plus build/seed/boot, so
    # 20 minutes leaves real headroom rather than matching a bare measured
    # total.
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_MEDIA_BASE_URL: http://127.0.0.1:9000/photoo-public
      # Matches S3_ENDPOINT below (#322): the presigned PUT/GET URL host, which
      # differs from the public read path above once a real deployment fronts
      # MinIO with a reverse proxy.
      NEXT_PUBLIC_STORAGE_ORIGIN: http://127.0.0.1:9000
      NEXT_PUBLIC_ALLOW_INDEXING: 'false'
      # Same local-MinIO workaround as browser-smoke - see the comment on
      # that job's copy of this variable before touching it.
      ALLOW_LOCAL_IMAGE_HOSTS: 'true'
      DATABASE_URL: postgresql://photoo:photoo_dev_password@127.0.0.1:5432/photoo_test
      SHADOW_DATABASE_URL: postgresql://photoo:photoo_dev_password@127.0.0.1:5432/photoo_shadow
      REDIS_URL: redis://127.0.0.1:6379
      SEED_USER_PASSWORD: correct-horse-battery-staple
      VERIFICATION_ENCRYPTION_KEY: 9DsORuh9HI1DUnXKM0DKVcgw36Y9NfbLBSlfPmQxwYs=
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: eu-west-1
      S3_ACCESS_KEY_ID: photoo_dev
      S3_SECRET_ACCESS_KEY: photoo_dev_password
      S3_FORCE_PATH_STYLE: 'true'
      S3_PRIVATE_BUCKET: photoo-private
      S3_PUBLIC_BUCKET: photoo-public
      S3_PUBLIC_BASE_URL: http://127.0.0.1:9000/photoo-public
      PORT: 4000
      PUBLIC_API_URL: http://127.0.0.1:4000
      WEB_ORIGINS: http://127.0.0.1:3000
      WEB_APP_URL: http://127.0.0.1:3000
      NODE_ENV: development
      TRUSTED_PROXIES: ''
      AUTH_SECRET: dev-only-auth-secret-change-me-please-32-chars-min
      AUTH_ENCRYPTION_KEY: qA5jxlkWykGDbMKLOSqgSGG+lbzsuDkUWUS8nV9twig=
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: photoo
          POSTGRES_PASSWORD: photoo_dev_password
          POSTGRES_DB: photoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U photoo -d photoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start MinIO, create buckets and allow anonymous reads of photoo-public
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=photoo_dev \
            -e MINIO_ROOT_PASSWORD=photoo_dev_password \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:9000/minio/health/ready; do sleep 1; done'
          cat > /tmp/photoo-public-anonymous-policy.json <<'EOF'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": {"AWS": ["*"]},
                "Action": ["s3:GetObject"],
                "Resource": ["arn:aws:s3:::photoo-public/*"]
              }
            ]
          }
          EOF
          docker run --rm --network host \
            --entrypoint sh \
            -e MC_HOST_local=http://photoo_dev:photoo_dev_password@127.0.0.1:9000 \
            -v /tmp/photoo-public-anonymous-policy.json:/tmp/photoo-public-anonymous-policy.json \
            quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z \
            -c "mc mb --ignore-existing local/photoo-private local/photoo-public && mc anonymous set none local/photoo-private && mc anonymous set-json /tmp/photoo-public-anonymous-policy.json local/photoo-public"
      - name: Create the test database
        env:
          PGPASSWORD: photoo_dev_password
        run: |
          psql -h 127.0.0.1 -U photoo -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE photoo_test;'
          psql -h 127.0.0.1 -U photoo -d photoo_test -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS postgis;'
      # Same reason as browser-smoke: the seed imports @photoo/shared, and
      # this job has no typecheck step to build it as a side effect.
      - name: Build the workspace packages the seed imports
        run: pnpm turbo run build --filter='@photoo/db^...'
      - name: Apply Prisma migrations and seed the test database
        run: pnpm --filter @photoo/db run migrate:deploy && pnpm --filter @photoo/db run seed
      - name: Build api and web
        run: pnpm exec turbo run build --filter=@photoo/api... --filter=@photoo/web...
      - name: Start api and web, wait until both answer
        run: |
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/
          pnpm --filter @photoo/api start &
          PORT=3000 HOSTNAME=0.0.0.0 node apps/web/.next/standalone/apps/web/server.js &

          wait_for() {
            local url="$1" deadline=$((SECONDS + 60)) body status
            body="$(mktemp)"
            while true; do
              status="$(curl -sS --max-time 5 -o "$body" -w '%{http_code}' "$url" 2>"$body.err")" \
                && [ "$status" = 200 ] && { rm -f "$body" "$body.err"; return 0; }
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::$url did not answer with HTTP 200 within 60s (last status: ${status:-none, see curl error below})"
                echo '--- curl stderr ---'; cat "$body.err"
                echo '--- response body ---'; cat "$body"
                rm -f "$body" "$body.err"
                return 1
              fi
              sleep 1
            done
          }

          wait_for http://127.0.0.1:4000/health
          wait_for http://127.0.0.1:3000/en
          wait_for http://127.0.0.1:3000/en/photographers/sofia-martins
          wait_for http://127.0.0.1:3000/en/job-offers/event-photographer-luxembourg-city
      # GitHub's ubuntu-latest runner image ships a real Chrome
      # (google-chrome-stable); chrome-launcher would find it unassisted for
      # the plain `lhci collect` run, but the puppeteerScript path
      # (consent-granted) launches its own browser via puppeteer-core, which
      # has no bundled Chromium of its own and needs an explicit path.
      - name: Locate the runner's Chrome for CHROME_PATH
        run: |
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "::error::No Chrome/Chromium found on this runner (checked google-chrome-stable, google-chrome, chromium-browser, chromium)" >&2
            exit 1
          fi
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Lighthouse budget - consent denied (gates the build)
        run: pnpm test:lighthouse
      - name: Save the consent-denied Lighthouse results for upload
        if: always()
        run: mv .lighthouseci .lighthouseci-denied 2>/dev/null || true
      # Report only (see the job comment above) - a failure here is
      # surfaced, never silent, but never blocks the build either.
      - name: Lighthouse - consent granted (report only, does not gate)
        if: always()
        continue-on-error: true
        run: pnpm test:lighthouse:consent-granted
      - name: Save the consent-granted Lighthouse results for upload
        if: always()
        run: mv .lighthouseci .lighthouseci-granted 2>/dev/null || true
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: |
            .lighthouseci-denied/
            .lighthouseci-granted/
          retention-days: 7
          if-no-files-found: ignore

  # Real test of infra/dokploy/backup/backup.sh: builds the same image the
  # preview's `backup` service runs, so this also catches a broken
  # infra/docker/backup.Dockerfile (docs/steps/1E.3-backups.md), then
  # asserts the object it uploads decrypts and restores, and that the
  # missing-BACKUP_AGE_RECIPIENT guard actually refuses to run.
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: photoo
          POSTGRES_PASSWORD: photoo_dev_password
          POSTGRES_DB: photoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U photoo -d photoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Build the backup image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/backup.Dockerfile
          tags: photosite-backup:ci
          load: true
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup

      - name: Start MinIO and create the backup bucket with a scoped user
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=rootuser -e MINIO_ROOT_PASSWORD=rootpassword123 \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:9000/minio/health/ready; do sleep 1; done'
          cat > /tmp/photoo-backup-policy.json <<'EOF'
          {
            "Version": "2012-10-17",
            "Statement": [
              {"Effect": "Allow", "Action": ["s3:ListBucket"], "Resource": ["arn:aws:s3:::photoo-backups"]},
              {"Effect": "Allow", "Action": ["s3:PutObject"], "Resource": ["arn:aws:s3:::photoo-backups/*"]}
            ]
          }
          EOF
          docker run --rm --network host \
            --entrypoint sh \
            -e MC_HOST_local=http://rootuser:rootpassword123@127.0.0.1:9000 \
            -v /tmp/photoo-backup-policy.json:/tmp/photoo-backup-policy.json \
            quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z \
            -c "mc mb --ignore-existing local/photoo-backups && mc anonymous set none local/photoo-backups && mc admin user add local backupuser backuppassword123 && mc admin policy create local photoo-backup /tmp/photoo-backup-policy.json && mc admin policy attach local photoo-backup --user backupuser"

      - name: Seed rows past the size floor
        env:
          PGPASSWORD: photoo_dev_password
        run: |
          psql -h 127.0.0.1 -U photoo -d photoo -v ON_ERROR_STOP=1 -c "
            CREATE TABLE demo (id serial primary key, name text);
            INSERT INTO demo (name) SELECT 'row-with-padding-' || g FROM generate_series(1, 3000) g;
          "

      - name: Generate a throwaway age identity
        run: |
          docker run --rm --entrypoint age-keygen photosite-backup:ci >/tmp/identity.txt 2>/tmp/pubkey.txt
          echo "recipient=$(sed -n 's/^Public key: //p' /tmp/pubkey.txt)" >>"$GITHUB_ENV"

      - name: Run backup.sh
        run: |
          docker run --rm --network host --entrypoint backup.sh \
            -e POSTGRES_HOST=127.0.0.1 -e POSTGRES_USER=photoo -e POSTGRES_PASSWORD=photoo_dev_password -e POSTGRES_DB=photoo \
            -e BACKUP_AGE_RECIPIENT="${{ env.recipient }}" \
            -e BACKUP_ENV=ci -e MINIO_ENDPOINT=http://127.0.0.1:9000 -e BACKUP_BUCKET=photoo-backups \
            -e BACKUP_ACCESS_KEY=backupuser -e BACKUP_SECRET_KEY=backuppassword123 \
            photosite-backup:ci

      - name: Assert an encrypted, restorable object appears
        run: |
          object=$(docker run --rm --network host \
            -e MC_HOST_local=http://rootuser:rootpassword123@127.0.0.1:9000 \
            quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z \
            find local/photoo-backups/photoo/ci/ --name '*.dump.age')
          test -n "$object"
          mkdir -p /tmp/verify && chmod 777 /tmp/verify
          docker run --rm --network host \
            -e MC_HOST_local=http://rootuser:rootpassword123@127.0.0.1:9000 \
            -v /tmp/verify:/verify \
            quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z cp "$object" /verify/dump.age
          docker run --rm -v /tmp/verify:/verify -v /tmp/identity.txt:/identity.txt \
            --entrypoint sh photosite-backup:ci -c \
            'age --decrypt -i /identity.txt -o /verify/dump.plain /verify/dump.age && pg_restore --list /verify/dump.plain | grep -q "TABLE DATA"'

      - name: Confirm the missing-BACKUP_AGE_RECIPIENT guard refuses to run
        run: |
          if docker run --rm --network host --entrypoint backup.sh \
              -e POSTGRES_HOST=127.0.0.1 -e POSTGRES_USER=photoo -e POSTGRES_PASSWORD=photoo_dev_password -e POSTGRES_DB=photoo \
              -e BACKUP_ENV=ci -e MINIO_ENDPOINT=http://127.0.0.1:9000 -e BACKUP_BUCKET=photoo-backups \
              -e BACKUP_ACCESS_KEY=backupuser -e BACKUP_SECRET_KEY=backuppassword123 \
              photosite-backup:ci; then
            echo "::error::backup.sh must refuse to run without BACKUP_AGE_RECIPIENT" >&2
            exit 1
          fi

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Expo pins these to the installed SDK, so they are upgraded together with
    # `expo install` at an SDK bump, never one at a time. Dependabot proposed
    # major bumps for all three and each broke a different thing: Sentry 8
    # shipped untransformed ESM, gesture-handler 3 wanted a reanimated API that
    # is not there, and jest 30 pulled a build script outside `allowBuilds`.
    # Every name here belongs to apps/mobile alone, so this cannot hold back a
    # web or admin update. Security advisories still come through - `ignore`
    # only suppresses version updates.
    ignore:
      - dependency-name: react-native
      - dependency-name: react-native-gesture-handler
      - dependency-name: react-native-reanimated
      - dependency-name: '@sentry/react-native'
      - dependency-name: jest
      - dependency-name: jest-expo
      # Same reason, via the scope rather than the package: a minor bump of
      # `@react-native/jest-preset` in the grouped update left jest-expo unable
      # to resolve `@react-native/assets-registry/registry`, failing every
      # mobile suite. These move with the SDK too. Only apps/mobile uses the
      # scope, so the other 15 packages in that group still come through.
      - dependency-name: '@react-native/*'
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly

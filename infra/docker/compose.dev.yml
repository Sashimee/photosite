services:
  postgres:
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy infra/docker/.env.example to infra/docker/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy infra/docker/.env.example to infra/docker/.env}
      POSTGRES_DB: ${POSTGRES_DB:?copy infra/docker/.env.example to infra/docker/.env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:?copy infra/docker/.env.example to infra/docker/.env}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-test-db.sh:/docker-entrypoint-initdb.d/10-init-test-db.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:${REDIS_PORT:?copy infra/docker/.env.example to infra/docker/.env}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?copy infra/docker/.env.example to infra/docker/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?copy infra/docker/.env.example to infra/docker/.env}
    ports:
      - '127.0.0.1:${MINIO_API_PORT:?copy infra/docker/.env.example to infra/docker/.env}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:?copy infra/docker/.env.example to infra/docker/.env}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?copy infra/docker/.env.example to infra/docker/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?copy infra/docker/.env.example to infra/docker/.env}
    entrypoint:
      - sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD
        mc mb --ignore-existing local/photoo-private
        mc mb --ignore-existing local/photoo-public
        mc anonymous set none local/photoo-private
        cat > /tmp/photoo-public-anonymous-policy.json <<'EOF'
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {"AWS": ["*"]},
              "Action": ["s3:GetObject"],
              "Resource": ["arn:aws:s3:::photoo-public/*"]
            }
          ]
        }
        EOF
        mc anonymous set-json /tmp/photoo-public-anonymous-policy.json local/photoo-public
    restart: 'no'

  mailpit:
    image: axllent/mailpit:v1.31.1
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:?copy infra/docker/.env.example to infra/docker/.env}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:?copy infra/docker/.env.example to infra/docker/.env}:8025'

  # clamav/clamav's entrypoint runs freshclam once, synchronously, before
  # clamd starts, to fetch the initial signature database (~200 MB); on a
  # cold clamav-data volume this can take several minutes, so this service
  # is intentionally left out of `pnpm stack:up`'s `--wait` list (see root
  # package.json) and started separately without waiting.
  clamav:
    image: clamav/clamav:1.5.4-debian13-slim
    restart: unless-stopped
    ports:
      - '127.0.0.1:${CLAMAV_PORT:?copy infra/docker/.env.example to infra/docker/.env}:3310'
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10m

volumes:
  postgres-data:
  redis-data:
  minio-data:
  clamav-data:
